name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: bun-windows-x64
            artifact: lightningloop-windows-x64.exe
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: lightningloop-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install deps
        run: bun install
      - name: Build harness
        run: npm run build:harness
      - name: Compile standalone binary
        run: bun build Harness/web/standalone.ts --compile --outfile dist/${{ matrix.artifact }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          name: LightningLoop ${{ github.ref_name || 'v0.1.0' }}
          body: |
            ## LightningLoop — download and run

            **No install required.** Download the file for your platform, run it,
            and your browser opens automatically. Enter your own API key in Settings.

            ### Downloads
            - **Windows**: `lightningloop-windows-x64.exe` — double-click to run
            - **macOS** (Apple Silicon): `lightningloop-darwin-arm64` — run in Terminal (`chmod +x` then `./lightningloop-darwin-arm64`)

            ### Your own key
            Everyone brings their own API key. Enter yours in Settings (it stays
            in your browser only — never sent to any server you don't control).

            ### Also available
            - **Web version** (no download): see the README for the GitHub Pages link
            - **Self-host**: click "Deploy to Render" in the README
          files: |
            dist/lightningloop-windows-x64.exe
            dist/lightningloop-darwin-arm64
          draft: false
          prerelease: false
