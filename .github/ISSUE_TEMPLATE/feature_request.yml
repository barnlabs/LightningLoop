name: Feature request
description: Propose one bounded LightningLoop improvement with a falsifiable done condition.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: User and job
      description: Who needs this, and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: State the outcome, invariants, failure states, and observable proof.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Security and ownership boundary
      description: Explain provider, credential, runtime, managed-content, artifact, or update implications.
