name: CerebrasLoop
options:
  bundleIdPrefix: com.barnlabs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  CerebrasLoop:
    type: application
    platform: macOS
    sources:
      - path: CerebrasLoop
        excludes:
          - Resources/AppIconMaster.png
    resources:
      - path: CerebrasLoop/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barnlabs.CerebrasLoop
        PRODUCT_NAME: CerebrasLoop
        INFOPLIST_KEY_CFBundleDisplayName: CerebrasLoop
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 BarnLabs. Independent project; not affiliated with Cerebras Systems."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - CerebrasLoopTests
  CerebrasLoopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CerebrasLoopTests
    dependencies:
      - target: CerebrasLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barnlabs.CerebrasLoopTests
        GENERATE_INFOPLIST_FILE: YES
