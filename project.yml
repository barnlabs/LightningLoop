name: LightningLoop
options:
  bundleIdPrefix: com.barnlabs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  LightningLoop:
    type: application
    platform: macOS
    sources:
      - path: LightningLoop
        excludes:
          - Resources/AppIconMaster.png
    resources:
      - path: LightningLoop/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barnlabs.LightningLoop
        PRODUCT_NAME: LightningLoop
        INFOPLIST_KEY_CFBundleDisplayName: LightningLoop
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 BarnLabs. Open-source project."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - LightningLoopTests
  LightningLoopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - LightningLoopTests
    dependencies:
      - target: LightningLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barnlabs.LightningLoopTests
        GENERATE_INFOPLIST_FILE: YES
  LightningLoopUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - LightningLoopUITests
    dependencies:
      - target: LightningLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barnlabs.LightningLoopUITests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  LightningLoopUI:
    build:
      targets:
        LightningLoop: all
        LightningLoopUITests: [test]
    test:
      targets:
        - LightningLoopUITests
