<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LightningLoop</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>⚡ <span>LightningLoop</span></h1>
    <p class="tag">Watch a prompt become a sophisticated answer.</p>
  </header>

  <main>
    <!-- STEP 1: the goal -->
    <section id="goal-section">
      <label for="goal">What do you want answered?</label>
      <textarea id="goal" rows="3" placeholder="e.g. Where's the best coffee near me?"></textarea>

      <fieldset class="mode-toggle">
        <legend>Question mode</legend>
        <label class="radio"><input type="radio" name="mode" value="open_ended" checked /> <span><strong>Open-ended</strong> — type your own answers</span></label>
        <label class="radio"><input type="radio" name="mode" value="multiple_choice" /> <span><strong>Multiple choice</strong> — pick from generated options</span></label>
      </fieldset>

      <div class="row">
        <input id="run-btn" type="button" value="Start ▸" />
        <span id="conn-status" class="status">connecting…</span>
      </div>
    </section>

    <!-- STEP 2: classification + clarifying questions (slideshow) -->
    <section id="clarify-section" hidden>
      <div id="classification-badge" class="badge" hidden></div>
      <h2>A few quick questions</h2>
      <p id="clarify-summary" class="summary"></p>
      <div id="clarify-questions"></div>
    </section>

    <!-- STEP 3: live loop -->
    <section id="loop-section" hidden>
      <h2 id="loop-title">Running</h2>
      <ol id="stage-tracker" class="stages"></ol>
      <div id="log" class="log"></div>
      <div class="row">
        <input id="cancel-btn" type="button" value="Cancel" />
      </div>
    </section>

    <!-- STEP 4: result + feedback -->
    <section id="result-section" hidden>
      <div id="verdict" class="verdict"></div>
      <div id="deliverable" class="deliverable"></div>
      <div class="row">
        <input id="again-btn" type="button" value="Ask another ↺" />
      </div>
    </section>

    <!-- STEP 5: feedback -->
    <section id="feedback-section" hidden>
      <h2>How was that answer?</h2>
      <div class="rating">
        <label><input type="radio" name="rating" value="1" /> 😡 Poor</label>
        <label><input type="radio" name="rating" value="2" /> 🙁 Fair</label>
        <label><input type="radio" name="rating" value="3" /> 😐 Okay</label>
        <label><input type="radio" name="rating" value="4" /> 🙂 Good</label>
        <label><input type="radio" name="rating" value="5" /> 🤩 Great</label>
      </div>
      <label class="mt" for="followup">Want to clarify further or ask more?</label>
      <textarea id="followup" rows="2" placeholder="Ask a follow-up question or tell it what to change…"></textarea>
      <div class="row">
        <input id="followup-submit" type="button" value="Get a refined answer ▸" />
        <input id="followup-done" type="button" value="Done" />
      </div>
    </section>

    <div id="error-banner" class="error" hidden></div>
  </main>

  <script src="/client.js"></script>
</body>
</html>
